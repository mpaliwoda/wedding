<svg width="180" height="200" viewBox="0 0 180 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple elegant floral decoration for bottom -->

  <!-- Pink flower cluster left -->
  <circle cx="50" cy="60" r="12" fill="#e8b4c8" opacity="0.7"/>
  <circle cx="65" cy="55" r="10" fill="#f5cfd9" opacity="0.7"/>
  <circle cx="42" cy="50" r="9" fill="#e8b4c8" opacity="0.6"/>
  <circle cx="58" cy="45" r="8" fill="#d48ba6" opacity="0.8"/>
  <circle cx="53" cy="55" r="5" fill="#d48ba6"/>

  <!-- Purple flower cluster center -->
  <circle cx="90" cy="70" r="14" fill="#b39cc4" opacity="0.7"/>
  <circle cx="107" cy="65" r="12" fill="#c5b0d5" opacity="0.7"/>
  <circle cx="82" cy="60" r="10" fill="#b39cc4" opacity="0.6"/>
  <circle cx="99" cy="55" r="9" fill="#9b7aad" opacity="0.8"/>
  <circle cx="94" cy="65" r="6" fill="#9b7aad"/>

  <!-- Pink flower cluster right -->
  <circle cx="130" cy="60" r="12" fill="#f5cfd9" opacity="0.7"/>
  <circle cx="115" cy="55" r="10" fill="#e8b4c8" opacity="0.7"/>
  <circle cx="138" cy="50" r="9" fill="#f5cfd9" opacity="0.6"/>
  <circle cx="122" cy="45" r="8" fill="#d48ba6" opacity="0.8"/>
  <circle cx="127" cy="55" r="5" fill="#d48ba6"/>

  <!-- Leaves -->
  <ellipse cx="60" cy="65" rx="8" ry="3" fill="#8b9e7d" opacity="0.4" transform="rotate(-25 60 65)"/>
  <ellipse cx="85" cy="80" rx="10" ry="4" fill="#a8b99a" opacity="0.4" transform="rotate(15 85 80)"/>
  <ellipse cx="120" cy="65" rx="8" ry="3" fill="#8b9e7d" opacity="0.4" transform="rotate(25 120 65)"/>
  <ellipse cx="105" cy="75" rx="7" ry="3" fill="#a8b99a" opacity="0.3" transform="rotate(-30 105 75)"/>

  <!-- Stems -->
  <path d="M 53 67 Q 51 80 49 105" stroke="#8b9e7d" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 94 77 Q 92 90 90 115" stroke="#8b9e7d" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 127 67 Q 129 80 131 105" stroke="#8b9e7d" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
