<svg width="200" height="250" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple elegant floral corner decoration -->

  <!-- Purple flowers -->
  <circle cx="140" cy="60" r="14" fill="#b39cc4" opacity="0.7"/>
  <circle cx="125" cy="55" r="12" fill="#c5b0d5" opacity="0.7"/>
  <circle cx="148" cy="50" r="10" fill="#b39cc4" opacity="0.6"/>
  <circle cx="132" cy="45" r="9" fill="#9b7aad" opacity="0.8"/>
  <circle cx="137" cy="55" r="6" fill="#9b7aad"/>

  <!-- Pink flowers -->
  <circle cx="110" cy="90" r="12" fill="#f5cfd9" opacity="0.7"/>
  <circle cx="93" cy="85" r="10" fill="#e8b4c8" opacity="0.7"/>
  <circle cx="118" cy="80" r="9" fill="#f5cfd9" opacity="0.6"/>
  <circle cx="101" cy="75" r="8" fill="#d48ba6" opacity="0.8"/>
  <circle cx="105" cy="85" r="5" fill="#d48ba6"/>

  <!-- Small accent flowers -->
  <circle cx="150" cy="95" r="8" fill="#e8b4c8" opacity="0.6"/>
  <circle cx="142" cy="90" r="6" fill="#f5cfd9" opacity="0.6"/>
  <circle cx="146" cy="95" r="3" fill="#d48ba6"/>

  <!-- Leaves -->
  <ellipse cx="130" cy="70" rx="8" ry="3" fill="#8b9e7d" opacity="0.4" transform="rotate(30 130 70)"/>
  <ellipse cx="118" cy="100" rx="10" ry="4" fill="#a8b99a" opacity="0.4" transform="rotate(-20 118 100)"/>
  <ellipse cx="140" cy="85" rx="7" ry="3" fill="#8b9e7d" opacity="0.3" transform="rotate(45 140 85)"/>

  <!-- Stems -->
  <path d="M 137 68 Q 135 85 133 115" stroke="#8b9e7d" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 105 97 Q 108 110 110 130" stroke="#8b9e7d" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
