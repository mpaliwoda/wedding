<svg width="200" height="250" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Watercolor-style floral design for right side -->
  <defs>
    <filter id="watercolor">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="5" seed="3"/>
      <feColorMatrix type="saturate" values="0.5"/>
      <feBlend in="SourceGraphic" in2="blurOut" mode="multiply"/>
    </filter>
  </defs>

  <!-- Pink large flower -->
  <ellipse cx="110" cy="70" rx="24" ry="27" fill="#e8b4c8" opacity="0.7" filter="url(#watercolor)"/>
  <ellipse cx="140" cy="65" rx="22" ry="25" fill="#f5cfd9" opacity="0.7" filter="url(#watercolor)"/>
  <ellipse cx="125" cy="48" rx="20" ry="24" fill="#e8b4c8" opacity="0.7" filter="url(#watercolor)"/>
  <ellipse cx="125" cy="88" rx="21" ry="23" fill="#f5cfd9" opacity="0.7" filter="url(#watercolor)"/>
  <ellipse cx="92" cy="65" rx="19" ry="22" fill="#e8b4c8" opacity="0.7" filter="url(#watercolor)"/>
  <circle cx="125" cy="68" r="11" fill="#d48ba6" opacity="0.8"/>

  <!-- Purple flower -->
  <ellipse cx="145" cy="135" rx="16" ry="18" fill="#c5b0d5" opacity="0.7" filter="url(#watercolor)"/>
  <ellipse cx="162" cy="130" rx="15" ry="17" fill="#b39cc4" opacity="0.7" filter="url(#watercolor)"/>
  <ellipse cx="153" cy="118" rx="14" ry="16" fill="#c5b0d5" opacity="0.7" filter="url(#watercolor)"/>
  <ellipse cx="153" cy="146" rx="15" ry="16" fill="#b39cc4" opacity="0.7" filter="url(#watercolor)"/>
  <ellipse cx="135" cy="130" rx="13" ry="15" fill="#c5b0d5" opacity="0.7" filter="url(#watercolor)"/>
  <circle cx="153" cy="132" r="7" fill="#9b7aad" opacity="0.8"/>

  <!-- Small yellow accent -->
  <ellipse cx="85" cy="115" rx="10" ry="11" fill="#f4d58d" opacity="0.6" filter="url(#watercolor)"/>
  <ellipse cx="97" cy="113" rx="9" ry="10" fill="#f7e4a8" opacity="0.6" filter="url(#watercolor)"/>
  <ellipse cx="91" cy="105" rx="8" ry="10" fill="#f4d58d" opacity="0.6" filter="url(#watercolor)"/>
  <ellipse cx="91" cy="122" rx="9" ry="9" fill="#f7e4a8" opacity="0.6" filter="url(#watercolor)"/>
  <circle cx="91" cy="114" r="5" fill="#e8c170" opacity="0.7"/>

  <!-- Stems and leaves -->
  <path d="M 125 88 Q 120 110 115 145" stroke="#8b9e7d" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 153 146 Q 150 165 148 190" stroke="#8b9e7d" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 91 122 Q 88 140 85 160" stroke="#8b9e7d" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Leaves -->
  <ellipse cx="118" cy="105" rx="14" ry="7" fill="#a8b99a" opacity="0.5" transform="rotate(25 118 105)"/>
  <ellipse cx="108" cy="125" rx="13" ry="7" fill="#8b9e7d" opacity="0.5" transform="rotate(-20 108 125)"/>
  <ellipse cx="150" cy="160" rx="12" ry="6" fill="#a8b99a" opacity="0.5" transform="rotate(30 150 160)"/>
  <ellipse cx="88" cy="135" rx="11" ry="5" fill="#8b9e7d" opacity="0.5" transform="rotate(-25 88 135)"/>
</svg>
