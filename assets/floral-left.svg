<svg width="200" height="250" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple elegant floral corner decoration -->

  <!-- Pink flowers -->
  <circle cx="60" cy="50" r="12" fill="#e8b4c8" opacity="0.7"/>
  <circle cx="75" cy="45" r="10" fill="#f5cfd9" opacity="0.7"/>
  <circle cx="52" cy="40" r="9" fill="#e8b4c8" opacity="0.6"/>
  <circle cx="68" cy="35" r="8" fill="#d48ba6" opacity="0.8"/>
  <circle cx="60" cy="50" r="5" fill="#d48ba6"/>

  <!-- Purple flowers -->
  <circle cx="90" cy="80" r="14" fill="#c5b0d5" opacity="0.7"/>
  <circle cx="107" cy="75" r="12" fill="#b39cc4" opacity="0.7"/>
  <circle cx="82" cy="70" r="10" fill="#c5b0d5" opacity="0.6"/>
  <circle cx="99" cy="65" r="9" fill="#9b7aad" opacity="0.8"/>
  <circle cx="95" cy="75" r="6" fill="#9b7aad"/>

  <!-- Small accent flowers -->
  <circle cx="50" cy="100" r="8" fill="#f5cfd9" opacity="0.6"/>
  <circle cx="58" cy="95" r="6" fill="#e8b4c8" opacity="0.6"/>
  <circle cx="54" cy="100" r="3" fill="#d48ba6"/>

  <!-- Leaves -->
  <ellipse cx="70" cy="60" rx="8" ry="3" fill="#8b9e7d" opacity="0.4" transform="rotate(-30 70 60)"/>
  <ellipse cx="82" cy="90" rx="10" ry="4" fill="#a8b99a" opacity="0.4" transform="rotate(20 82 90)"/>
  <ellipse cx="60" cy="75" rx="7" ry="3" fill="#8b9e7d" opacity="0.3" transform="rotate(-45 60 75)"/>

  <!-- Stems -->
  <path d="M 60 62 Q 58 80 56 110" stroke="#8b9e7d" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 95 87 Q 92 100 90 125" stroke="#8b9e7d" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
